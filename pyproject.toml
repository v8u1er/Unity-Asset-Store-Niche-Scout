[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niche-scout"
version = "0.1.0"
description = "Unity Asset Store Niche Scout"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "v8u1er", email = "17022402+v8u1er@users.noreply.github.com" },
]
dependencies = ["plotly>=7.1,<8", "dash==4.4.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/v8u1er/unity-asset-store-niche-scout"
Repository = "https://github.com/v8u1er/unity-asset-store-niche-scout"
Issues = "https://github.com/v8u1er/unity-asset-store-niche-scout/issues"

[project.scripts]
niche-scout = "niche_scout.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niche_scout = ["assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "lreq(requirement_id): trace an analytical test to an individual LREQ requirement",
]

[tool.ruff]
line-length = 88
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
