[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niche-scout"
version = "0.1.0"
description = "Unity Asset Store Niche Scout"
requires-python = ">=3.11"
dependencies = ["plotly>=7.1,<8", "dash==4.4.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
niche-scout = "niche_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "lreq(requirement_id): trace an analytical test to an individual LREQ requirement",
]

[tool.ruff]
line-length = 88
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
